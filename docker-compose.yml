# Base de données de Rhéa : PostgreSQL avec l'extension pgvector, pour le développement local.
# Démarrage : npm run db:up. Arrêt : npm run db:down (les données sont conservées dans le volume).
services:
  db:
    image: pgvector/pgvector:pg18
    shm_size: 1gb # mémoire partagée du conteneur (64 Mo par défaut) : un gros index construit en parallèle en a besoin
    environment:
      POSTGRES_USER: rhea
      POSTGRES_PASSWORD: rhea # identifiants de développement local uniquement
      POSTGRES_DB: rhea
    ports:
      - "127.0.0.1:5432:5432" # accessible depuis votre machine seulement
    volumes:
      - donnees:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U rhea -d rhea"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  donnees:
